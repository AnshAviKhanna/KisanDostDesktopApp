name: kisandost_app
description: "A desktop app to process local images for KisanDost."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  process: ^5.0.2
  file_picker: ^8.0.0
  path_provider: ^2.1.3
  sqflite_common_ffi: ^2.3.3
  platform: ^3.1.5
  path: ^1.9.0
  intl: ^0.19.0
  http: ^1.2.1 # For calling the Go API server

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - backend/executables/